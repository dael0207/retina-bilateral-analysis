name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --frozen ruff check retina tests
      - run: uv run --frozen ruff format --check retina tests
      - run: uv run --frozen basedpyright
      - run: uv run --frozen pytest -q
