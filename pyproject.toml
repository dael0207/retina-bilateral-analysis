[project]
name = "retina-bilateral-analysis"
version = "1.1.0"
description = "Reproducible bilateral diabetic-retinopathy label analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.4",
    "pydantic==2.13.4",
]

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pytest==9.0.3",
    "ruff==0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "FBT001", "FBT002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "PLR2004", "SLF001", "ARG"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
include = ["retina"]
exclude = [".venv", "outputs"]
